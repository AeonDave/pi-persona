version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      pi-host:
        patterns:
          - "@earendil-works/pi-*"
      npm-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@earendil-works/pi-*"
        update-types:
          - minor
          - patch
    ignore:
      # Keep typings aligned with the oldest Node runtime we support.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
